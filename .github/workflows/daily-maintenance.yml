name: Sculra Daily Maintenance

on:
  schedule:
    # Runs daily at 08:30 AM India Standard Time (IST)
    # India Standard Time (IST) = UTC + 05:30
    # 08:30 IST - 05:30 = 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (test and verify without committing or pushing)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force execution even if a daily commit already exists for today'
        type: boolean
        required: false
        default: false
      category:
        description: 'Maintenance category filter'
        type: choice
        required: false
        default: 'auto'
        options:
          - auto
          - docs
          - types
          - tests
          - lint
          - validation

permissions:
  contents: write

jobs:
  maintenance:
    name: Daily Maintenance & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50 # Fetch history to check for prior daily commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm cache directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git Bot Identity
        run: |
          git config user.name "sculra-bot"
          git config user.email "sculra-bot@users.noreply.github.com"
          echo "Verified Git User: $(git config user.name) <$(git config user.email)>"
          echo "Current Branch: $(git branch --show-current)"

      - name: Execute Daily Maintenance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          CATEGORY_FLAG="--category=${{ github.event.inputs.category || 'auto' }}"
          pnpm maintenance:daily $DRY_RUN_FLAG $FORCE_FLAG $CATEGORY_FLAG
