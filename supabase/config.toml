# ==============================================================================
# Supabase Local Development CLI Configuration (supabase/config.toml)
# ==============================================================================

project_id = "sculra"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
port = 54323
enabled = true

[inbucket]
port = 54324
smtp_port = 25
pop3_port = 110

[storage]
enabled = true
file_size_limit = "50MB"

[auth]
enabled = false # Supabase Auth is NOT used. Clerk handles authentication.
